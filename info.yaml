yaml_version: 6

project:
  title: "Tiny Game Engine"
  author: "elieli1269"
  description: "Mini hardware game engine with score and collision logic"
  language: "Verilog"
  top_module: "tt_um_game_engine"
  clock_hz: 1000000
  tags:
    - game
    - hardware
    - tinytapeout
  tiles:
    cols: 1
    rows: 1

pinout:
  clk:
    type: input
    description: "Clock signal"
  rst_n:
    type: input
    description: "Active-low reset"
  ui_in[0]:
    type: input
    description: "Player button"
  uo_out[3:0]:
    type: output
    description: "Player position"
  uo_out[7:4]:
    type: output
    description: "Score"
